apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-ticketing-dev-redis
  namespace: argocd
spec:
  project: event-ticketing-dev
  sources:
    - repoURL: https://github.com/Event-ticket-system-management/event-ticketing-infrastructure.git
      targetRevision: main
      path: helm/charts/redis
      helm:
        releaseName: redis
        valueFiles:
          - $values/argocd/environments/dev/values/redis-values.yaml

    - repoURL: https://github.com/Event-ticket-system-management/event-ticketing-infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: event-ticketing-argocd-dev
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-ticketing-dev-event-service
  namespace: argocd
spec:
  project: event-ticketing-dev
  sources:
    - repoURL: https://github.com/Event-ticket-system-management/event-ticketing-infrastructure.git
      targetRevision: main
      path: helm/charts/event-service
      helm:
        releaseName: event-service
        valueFiles:
          - $values/argocd/environments/dev/values/event-service-values.yaml
    - repoURL: https://github.com/Event-ticket-system-management/event-ticketing-infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: event-ticketing-argocd-dev
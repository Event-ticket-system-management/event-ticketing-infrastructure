replicaCount: 2
image:
  repository: event-ticketing-booking-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
config:
  serverPort: "8083"
  dbUrl: "jdbc:postgresql://postgres:5432/booking_db"
  redisHost: "redis"
  redisPort: "6379"
  kafkaBootstrapServers: "kafka:9092"
  eventServiceUrl: "http://event-service:8082"
  javaToolOptions: "-XX:MaxRAMPercentage=75.0"
resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 500m
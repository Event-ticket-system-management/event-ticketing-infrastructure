replicaCount: 2
image:
  repository: event-ticketing-event-service
  tag: "1.0.1"
  pullPolicy: IfNotPresent
config:
  serverPort: "8082"
  dbUrl: "jdbc:postgresql://postgres:5432/event_db"
  redisHost: "redis"
  redisPort: "6379"
  javaToolOptions: "-XX:MaxRAMPercentage=75.0"
resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 500m
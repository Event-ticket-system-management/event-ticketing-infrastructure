replicaCount: 2
image:
  repository: event-ticketing-payment-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
config:
  port: "8084"
  dbHost: "postgres"
  dbPort: "5432"
  dbName: "payment_db"
  kafkaBrokers: "kafka:9092"
resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 500m
migration:
  enabled: true
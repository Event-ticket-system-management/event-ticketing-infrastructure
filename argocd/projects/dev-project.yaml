apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: event-ticketing-dev
  namespace: argocd
spec:
  description: Development environment for the Event Ticketing System
  sourceRepos:
    - https://github.com/Event-ticket-system-management/event-ticketing-infrastructure.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: event-ticketing-argocd-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: Service

    - group: ""
      kind: ConfigMap

    - group: ""
      kind: Secret

    - group: ""
      kind: PersistentVolumeClaim

    - group: apps
      kind: Deployment

    - group: apps
      kind: StatefulSet

    - group: batch
      kind: Job

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: event-ticketing
data:
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  USER_SERVICE_URL: {{ .Values.config.userServiceUrl | quote }}
  EVENT_SERVICE_URL: {{ .Values.config.eventServiceUrl | quote }}
  BOOKING_SERVICE_URL: {{ .Values.config.bookingServiceUrl | quote }}
  JAVA_TOOL_OPTIONS: {{ .Values.config.javaToolOptions | quote }}
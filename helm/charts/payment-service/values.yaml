replicaCount: 2
image:
  repository: event-ticketing-payment-service
  tag: "1.0.1"
  pullPolicy: IfNotPresent
config:
  port: "8084"
  dbHost: "postgres"
  dbPort: "5432"
  dbName: "payment_db"
  kafkaBrokers: "kafka-0.kafka-headless:9092"
existingSecrets:
  postgres:
    name: postgres-credentials
    usernameKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD
deployment:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 45
topologySpreadConstraints:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
initContainer:
  name: wait-for-postgres-and-kafka
  image: busybox:1.36
  postgres:
    host: postgres
    port: 5432
  kafka:
    host: kafka
    port: 9092
  maxAttempts: 60
  sleepSeconds: 2
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 500m
startupProbe:
  path: /api/v1/health/live
  failureThreshold: 24
  timeoutSeconds: 2
  periodSeconds: 5
readinessProbe:
  path: /api/v1/health/ready
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1
livenessProbe:
  path: /api/v1/health/live
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  command:
    - ./node_modules/.bin/typeorm
    - migration:run
    - -d
    - dist/database/data-source.js
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  hook:
    weight: "-5"
    deletePolicy: before-hook-creation,hook-succeeded
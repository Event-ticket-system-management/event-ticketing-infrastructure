apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.headlessService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.headlessService.publishNotReadyAddresses }}
  selector:
    app: kafka
  ports:
    - name: broker
      port: {{ .Values.kafka.listeners.brokerPort }}
      targetPort: broker
    - name: controller
      port: {{ .Values.kafka.listeners.controllerPort }}
      targetPort: controller
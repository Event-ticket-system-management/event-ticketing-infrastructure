apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
spec:
  type: {{ .Values.service.type }}
  selector:
    app: kafka
  ports:
    - name: broker
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: broker
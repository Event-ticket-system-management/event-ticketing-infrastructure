replicaCount: 2
image:
  repository: event-ticketing-booking-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
config:
  serverPort: "8083"
  dbUrl: "jdbc:postgresql://postgres:5432/booking_db"
  redisHost: "redis"
  redisPort: "6379"
  kafkaBootstrapServers: "kafka-0.kafka-headless:9092"
  eventServiceUrl: "http://event-service:8082"
  javaToolOptions: "-XX:MaxRAMPercentage=75.0"
existingSecrets:
  postgres:
    name: postgres-credentials
    usernameKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD
  redis:
    name: redis-secret
    passwordKey: REDIS_PASSWORD
  jwt:
    name: jwt-secret
    key: JWT_SECRET
service:
  type: ClusterIP
  port: 8083
  targetPort: 8083
deployment:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 45
topologySpreadConstraints:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
initContainer:
  name: wait-for-postgres-redis-and-kafka
  image: busybox:1.36
  postgres:
    host: postgres
    port: 5432
  redis:
    host: redis
    port: 6379
  kafka:
    host: kafka
    port: 9092
  maxAttempts: 60
  sleepSeconds: 2
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 500m
startupProbe:
  path: /actuator/health/liveness
  failureThreshold: 24
  periodSeconds: 5
readinessProbe:
  path: /actuator/health/readiness
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  path: /actuator/health/liveness
  periodSeconds: 15
  failureThreshold: 3
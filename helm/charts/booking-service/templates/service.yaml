apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: booking-service
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: event-ticketing
spec:
  type: {{ .Values.service.type }}
  selector:
    app: booking-service
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: {{ .Values.service.type }}
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: redis
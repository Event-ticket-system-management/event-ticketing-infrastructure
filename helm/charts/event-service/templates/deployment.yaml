apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: event-service
    app.kubernetes.io/name: event-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: event-ticketing
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.deployment.strategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.deployment.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.deployment.strategy.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
        app.kubernetes.io/name: event-service
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      initContainers:
        - name: {{ .Values.initContainer.name }}
          image: {{ .Values.initContainer.image | quote }}
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 {{ .Values.initContainer.maxAttempts }}); do
                if nc -z {{ .Values.initContainer.postgres.host }} {{ .Values.initContainer.postgres.port }} && nc -z {{ .Values.initContainer.redis.host }} {{ .Values.initContainer.redis.port }}; then
                  echo "Dependencies reachable"
                  exit 0
                fi
                echo "Waiting for dependencies..."
                sleep {{ .Values.initContainer.sleepSeconds }}
              done
              echo "Dependency wait timed out"
              exit 1
      containers:
        - name: event-service
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: event-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.postgres.name }}
                  key: {{ .Values.existingSecrets.postgres.usernameKey }}

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.postgres.name }}
                  key: {{ .Values.existingSecrets.postgres.passwordKey }}

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.redis.name }}
                  key: {{ .Values.existingSecrets.redis.passwordKey }}

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.jwt.name }}
                  key: {{ .Values.existingSecrets.jwt.key }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: event-ticketing-dev
  labels:
    app: booking-service
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: event-ticketing
spec:
  type: ClusterIP
  selector:
    app: booking-service
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: http
apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
  namespace: event-ticketing-dev
data:
  SERVER_PORT: "8083"
  DB_URL: "jdbc:postgresql://postgres:5432/booking_db"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka-headless:9092"
  EVENT_SERVICE_URL: "http://event-service:8082"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
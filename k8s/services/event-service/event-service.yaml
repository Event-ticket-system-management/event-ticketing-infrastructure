    app.kubernetes.io/name: event-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: event-ticketing
spec:
  type: ClusterIP
  selector:
    app: event-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: event-ticketing-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: event-ticketing
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30080
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: event-ticketing-dev
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: broker
      protocol: TCP
      port: 9092
      targetPort: broker
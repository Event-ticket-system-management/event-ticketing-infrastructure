name: Validate PR Source Branch
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
permissions: {}
jobs:
  validate-source-branch:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull request source
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$SOURCE_BRANCH" != "develop" || "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "::error::Only the develop branch of this repository can be merged into main."
            exit 1
          fi

          echo "Pull request source branch is valid."